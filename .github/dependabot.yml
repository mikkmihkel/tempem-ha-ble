version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
  - package-ecosystem: pip
    directory: /esphome
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(firmware)
