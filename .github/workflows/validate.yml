name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    # HACS cannot read private repositories; runs once the repo is public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # brands: icons live in home-assistant/brands (only needed for the
          # HACS default store). topics: repository topics are a GitHub
          # setting, also only checked for the default store.
          ignore: brands topics

  tests:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt
      - name: Ruff
        run: |
          ruff check custom_components tests
          ruff format --check custom_components tests
      - name: Pytest
        run: pytest -q

  firmware:
    name: ESPHome config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install ESPHome
        run: pip install esphome
      - name: Validate firmware configs
        working-directory: esphome
        run: |
          cp secrets.yaml.example secrets.yaml
          esphome config tempem-remote-gateway.yaml > /dev/null
          for f in tests/*.yaml; do
            echo "::group::$f"
            esphome config "$f" > /dev/null
            echo "::endgroup::"
          done
      - name: Forwarder host tests
        run: bash esphome/tests/host/run_host_tests.sh
