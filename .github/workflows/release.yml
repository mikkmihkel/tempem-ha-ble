name: Release

# A release is cut when main carries a manifest.json version that has no tag
# yet (normally the "chore(release): vX.Y.Z" commit), or when a vX.Y.Z tag is
# pushed by hand. The tag, manifest.json and CHANGELOG.md must agree.

on:
  push:
    branches:
      - main
    paths:
      - custom_components/tempem_ble/manifest.json
      - CHANGELOG.md
      - .github/workflows/release.yml
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          version=$(jq -r .version custom_components/tempem_ble/manifest.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json version $version"
              exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "v$version is already released; nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi

      - name: Extract release notes
        if: steps.version.outputs.release == 'true'
        run: |
          awk -v v="${{ steps.version.outputs.version }}" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found && /^\[[^]]+\]: / {next}
            found {print}
          ' CHANGELOG.md > release-notes.md
          cat release-notes.md

      - name: Build HACS zip
        if: steps.version.outputs.release == 'true'
        run: |
          cd custom_components/tempem_ble
          zip -r "$GITHUB_WORKSPACE/tempem_ble.zip" . -x '__pycache__/*' '*.pyc'

      - name: Create GitHub release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: tempem_ble.zip
          fail_on_unmatched_files: true
