name: Release

# A release is cut when main carries a manifest.json version that has no tag
# yet (normally the "chore(release): vX.Y.Z" commit), or when a vX.Y.Z tag is
# pushed by hand. The tag, manifest.json and CHANGELOG.md must agree.
# One version covers both deliverables: the HACS integration zip and the
# remote gateway firmware (plus its browser installer on GitHub Pages).

on:
  push:
    branches:
      - main
    paths:
      - custom_components/tempem_ble/manifest.json
      - CHANGELOG.md
      - .github/workflows/release.yml
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          version=$(jq -r .version custom_components/tempem_ble/manifest.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json version $version"
              exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "v$version is already released; nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi

  firmware:
    name: Build firmware
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Cache ESP-IDF toolchain
        uses: actions/cache@v6
        with:
          path: ~/.cache/esphome
          key: esphome-${{ hashFiles('esphome/requirements.txt') }}
      - name: Install ESPHome
        run: pip install -r esphome/requirements.txt
      - name: Compile
        # The update source follows the repository, so a fork's gateways
        # update from the fork's releases.
        run: |
          esphome -s fw_version "${{ needs.prepare.outputs.version }}" \
            -s update_manifest_url "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/tempem-remote-gateway.manifest.json" \
            compile esphome/tempem-remote-gateway.yaml
      - name: Package
        run: |
          python esphome/scripts/make_manifests.py \
            --version "${{ needs.prepare.outputs.version }}" \
            --repo "$GITHUB_REPOSITORY" \
            --build-dir esphome/.esphome/build/tempem-remote/build \
            --site-template esphome/install \
            --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: dist
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [prepare, firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: firmware
          path: dist

      - name: Extract release notes
        run: |
          awk -v v="${{ needs.prepare.outputs.version }}" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found && /^\[[^]]+\]: / {next}
            found {print}
          ' CHANGELOG.md > release-notes.md
          cat >> release-notes.md <<'NOTES'

          ---
          **Gateway firmware:** install from the browser on the
          [installer page](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/),
          or flash `tempem-remote-gateway.factory.bin` at https://web.esphome.io. Gateways with
          *Auto-update* on install this release by themselves.
          NOTES
          cat release-notes.md

      - name: Build HACS zip
        run: |
          cd custom_components/tempem_ble
          zip -r "$GITHUB_WORKSPACE/tempem_ble.zip" . -x '__pycache__/*' '*.pyc'

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.prepare.outputs.version }}
          body_path: release-notes.md
          files: |
            tempem_ble.zip
            dist/release/tempem-remote-gateway.factory.bin
            dist/release/tempem-remote-gateway.ota.bin
            dist/release/tempem-remote-gateway.manifest.json
          fail_on_unmatched_files: true

  pages:
    name: Publish browser installer
    needs: [firmware, publish]
    runs-on: ubuntu-latest
    # Needs GitHub Pages enabled once (Settings -> Pages -> Source: GitHub
    # Actions). Without it the release is still complete.
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: firmware
          path: dist
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/site
      - id: deploy
        uses: actions/deploy-pages@v5
