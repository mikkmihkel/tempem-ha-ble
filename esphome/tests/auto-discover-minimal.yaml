# Config-validation test: auto-discovery only, no static targets, on_battery
# automation using the `mac` / `level` variables.
#   esphome config tests/auto-discover-minimal.yaml
esphome:
  name: tempem-auto-test

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: ../components
    components: [tempem_battery_poller]

logger:

wifi:
  ssid: "test-ssid"
  password: "test-password"

esp32_ble_tracker:

tempem_battery_poller:
  auto_discover: true
  on_battery:
    - logger.log:
        format: "battery %s = %u%%"
        args: [mac.c_str(), level]
